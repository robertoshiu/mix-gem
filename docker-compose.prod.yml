version: "3.9"

# Production Docker Compose for Mix-GEM Full Stack
# Use profiles to selectively enable service groups

networks:
  frontend_network:
    driver: bridge
    name: mixgem_frontend
  backend_network:
    driver: bridge
    name: mixgem_backend
  monitoring_network:
    driver: bridge
    name: mixgem_monitoring

volumes:
  mixgem_pgdata:
    name: mixgem_pgdata
  mixgem_redisdata:
    name: mixgem_redisdata
  mixgem_ollama_data:
    name: mixgem_ollama_data
  mixgem_rag_storage:
    name: mixgem_rag_storage
  mixgem_prometheus_data:
    name: mixgem_prometheus_data
  mixgem_grafana_data:
    name: mixgem_grafana_data
  mixgem_backup_data:
    name: mixgem_backup_data

services:
  # =============================================================================
  # Core Infrastructure (always enabled, no profile needed)
  # =============================================================================

  postgres:
    image: pgvector/pgvector:pg17
    container_name: mixgem_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-mixgem}
      POSTGRES_USER: ${DB_USER:-mixgem}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - mixgem_pgdata:/var/lib/postgresql/data
    shm_size: '256mb'
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=64MB
      -c maintenance_work_mem=256MB
      -c effective_cache_size=512MB
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mixgem} -d ${DB_NAME:-mixgem}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend_network
      - monitoring_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  redis:
    image: redis:7-alpine
    container_name: mixgem_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - mixgem_redisdata:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend_network
      - monitoring_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

