version: "3.9"

# Production Docker Compose for Mix-GEM Full Stack
# Use profiles to selectively enable service groups

networks:
  frontend_network:
    driver: bridge
    name: mixgem_frontend
  backend_network:
    driver: bridge
    name: mixgem_backend
  monitoring_network:
    driver: bridge
    name: mixgem_monitoring

volumes:
  mixgem_pgdata:
    name: mixgem_pgdata
  mixgem_redisdata:
    name: mixgem_redisdata
  mixgem_ollama_data:
    name: mixgem_ollama_data
  mixgem_rag_storage:
    name: mixgem_rag_storage
  mixgem_prometheus_data:
    name: mixgem_prometheus_data
  mixgem_grafana_data:
    name: mixgem_grafana_data
  mixgem_backup_data:
    name: mixgem_backup_data

services:
  # =============================================================================
  # Core Infrastructure (always enabled, no profile needed)
  # =============================================================================

  postgres:
    image: pgvector/pgvector:pg17
    container_name: mixgem_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-mixgem}
      POSTGRES_USER: ${DB_USER:-mixgem}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - mixgem_pgdata:/var/lib/postgresql/data
    shm_size: '256mb'
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=64MB
      -c maintenance_work_mem=256MB
      -c effective_cache_size=512MB
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mixgem} -d ${DB_NAME:-mixgem}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend_network
      - monitoring_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  redis:
    image: redis:7-alpine
    container_name: mixgem_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - mixgem_redisdata:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend_network
      - monitoring_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # =============================================================================
  # Ollama - Local LLM (profile: ollama)
  # =============================================================================

  ollama:
    image: ollama/ollama:latest
    container_name: mixgem_ollama
    profiles: ["ollama"]
    volumes:
      - mixgem_ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - backend_network
      - monitoring_network
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # =============================================================================
  # RAG Engine - LangGraph + LightRAG (profile: rag)
  # =============================================================================

  rag-engine:
    build:
      context: ./rag-engine
      dockerfile: Dockerfile
    container_name: mixgem_rag_engine
    profiles: ["rag"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${DB_USER:-mixgem}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_DATABASE: ${DB_NAME:-mixgem}
      REDIS_URL: redis://redis:6379
      OLLAMA_HOST: http://ollama:11434
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Anthropic API key required}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-snowflake-arctic-embed2}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-20250514}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${RAG_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    volumes:
      - mixgem_rag_storage:/app/lightrag_storage
    networks:
      - frontend_network
      - backend_network
      - monitoring_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # =============================================================================
  # Scavenger - SECS/GEM Ingestion (profile: scavenger)
  # =============================================================================

  scavenger-api:
    build:
      context: ./scavenger
      target: api
    container_name: mixgem_scavenger_api
    profiles: ["scavenger"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SCAVENGER_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-mixgem}:${DB_PASSWORD:?Database password required}@postgres:5432/${DB_NAME:-mixgem}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./scavenger/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - frontend_network
      - backend_network
      - monitoring_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  scavenger-recorder:
    build:
      context: ./scavenger
      target: recorder
    container_name: mixgem_scavenger_recorder
    profiles: ["scavenger"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-mixgem}:${DB_PASSWORD:?Database password required}@postgres:5432/${DB_NAME:-mixgem}
      REDIS_URL: redis://redis:6379/0
      BATCH_SIZE: ${BATCH_SIZE:-100}
      FLUSH_INTERVAL_MS: ${FLUSH_INTERVAL_MS:-1000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r=redis.from_url('redis://redis:6379/0'); r.ping()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend_network
      - monitoring_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # =============================================================================
  # SECS/GEM Simulator (profile: simulator)
  # =============================================================================

  scavenger-simulator:
    build:
      context: ./scavenger
      target: simulator
    container_name: mixgem_simulator
    profiles: ["simulator"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${HSMS_PASSIVE_PORT:-5000}:5000"
      - "${HSMS_ACTIVE_PORT:-5001}:5001"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-mixgem}:${DB_PASSWORD:?Database password required}@postgres:5432/${DB_NAME:-mixgem}
      REDIS_URL: redis://redis:6379/0
      HSMS_PASSIVE_PORT: 5000
      HSMS_ACTIVE_PORT: 5001
      HSMS_DEVICE_ID: ${HSMS_DEVICE_ID:-1}
      EQUIPMENT_ID: ${EQUIPMENT_ID:-LITHO01}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./scavenger/scenarios:/app/scenarios:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(1); s.connect(('localhost', 5000)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend_network
      - monitoring_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # =============================================================================
  # Monitoring Stack (profile: monitoring)
  # =============================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: mixgem_prometheus
    profiles: ["monitoring"]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - mixgem_prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - monitoring_network
      - frontend_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: mixgem_node_exporter
    profiles: ["monitoring"]
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - monitoring_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: mixgem_postgres_exporter
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER:-mixgem}:${DB_PASSWORD:?Database password required}@postgres:5432/${DB_NAME:-mixgem}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - backend_network
      - monitoring_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: mixgem_redis_exporter
    profiles: ["monitoring"]
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9121/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - backend_network
      - monitoring_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: mixgem_cadvisor
    profiles: ["monitoring"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - monitoring_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  grafana:
    image: grafana/grafana:latest
    container_name: mixgem_grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Grafana admin password required}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_AUTH_ANONYMOUS_ENABLED: false
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - mixgem_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - monitoring_network
      - frontend_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

