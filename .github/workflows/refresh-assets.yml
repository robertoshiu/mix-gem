name: Refresh 3D Assets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 06:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: equipment-monitor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: equipment-monitor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache fetched assets
        uses: actions/cache@v4
        with:
          path: |
            equipment-monitor/public/models
            equipment-monitor/public/env
            equipment-monitor/node_modules/.cache/meshy
            equipment-monitor/node_modules/.cache/tripo
          key: assets-${{ hashFiles('equipment-monitor/assets.manifest.yaml') }}-${{ github.run_number }}
          restore-keys: |
            assets-${{ hashFiles('equipment-monitor/assets.manifest.yaml') }}-

      - name: Run asset pipeline
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
          READYPLAYERME_APP_ID: ${{ secrets.READYPLAYERME_APP_ID }}
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
        run: npm run assets:refresh

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain public/models public/env CREDITS.md src/credits.json) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(assets): refresh 3D assets from pipeline'
          title: 'chore(assets): refresh 3D models and environment maps'
          body: |
            Automated asset refresh from the multi-source pipeline.

            **Sources checked:**
            - Poly Haven (HDRIs)
            - Sketchfab (equipment, accessories)
            - Meshy AI (AI-generated fallbacks)
            - Ready Player Me (character avatars)

            Review `CREDITS.md` for full attribution details.
          branch: chore/refresh-assets
          base: master
          labels: assets, automated
          delete-branch: true
