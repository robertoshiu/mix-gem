[project]
name = "rag-engine"
version = "0.2.0"
description = "ACE Context Engineering + Agentic RAG with LangGraph + LightRAG"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    
    # Database
    "asyncpg>=0.30.0",
    "psycopg[pool]>=3.2.0",
    
    # LangGraph (orchestration)
    "langgraph>=1.0.6",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    
    # LightRAG (knowledge layer)
    "lightrag-hku>=1.4.9",
    
    # Redis
    "redis>=5.2.0",
    
    # Embeddings
    "ollama>=0.4.0",
    
    # HTTP client
    "httpx>=0.28.0",
    
    # Logging
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
